[project]
name = "adduck"
version = "0.1.0"
description = "Privacy-first TV ad detector and volume ducker (cannot hear words, never stores audio)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
mic = ["sounddevice"]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
